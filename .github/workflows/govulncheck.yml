name: govulncheck

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Note on scope
        if: always()
        run: |
          echo "govulncheck scans only what's actually reachable from this module's code."
          echo "It will report nothing at all if go.mod has no external dependencies"
          echo "(current state as of 2026-07-25 — Phase 3 PQC implementation not yet started)."
