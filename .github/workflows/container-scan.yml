name: container-scan

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  trivy-scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "ghcr.io/jmasarweh/unifi-log-insight:latest"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  grype-scan:
    name: Grype scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Grype vulnerability database
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.114.0
          grype db update

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v7
        with:
          image: "ghcr.io/jmasarweh/unifi-log-insight:latest"
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Grype table output (visibility only)
        if: always()
        uses: anchore/scan-action@v7
        with:
          image: "ghcr.io/jmasarweh/unifi-log-insight:latest"
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: table
