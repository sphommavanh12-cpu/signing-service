name: container-scan

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  trivy-scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "ghcr.io/jmasarweh/unifi-log-insight:latest"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  grype-scan:
    name: Grype scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.80.0
          grype version

      - name: Update Grype vulnerability database
        run: grype db update

      - name: Run Grype vulnerability scan (gating)
        run: |
          grype ghcr.io/jmasarweh/unifi-log-insight:latest \
            --fail-on high \
            --only-fixed \
            -o table

      - name: Grype table output (visibility only)
        if: always()
        run: |
          grype ghcr.io/jmasarweh/unifi-log-insight:latest \
            --only-fixed \
            -o table || true
